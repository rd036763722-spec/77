name: Build EXE
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyinstaller pywebview
      - run: pyinstaller --noconfirm --onefile --windowed --name ChromeServerWizard --icon icon.ico --collect-all webview app.py
      - uses: actions/upload-artifact@v4
        with:
          name: ChromeServerWizard
          path: dist/ChromeServerWizard.exe
